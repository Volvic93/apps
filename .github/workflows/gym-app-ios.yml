name: Gym-App iOS (unsignierte IPA)

# Baut aus gym-app/webapp (Web-App) und gym-app/ipa-app (iOS-Hülle) eine UNSIGNIERTE .ipa für Sideloadly / AltStore.
# Löst bewusst NICHT bei jedem Push aus (macOS-Minuten sind teuer und der Lauf dauert eine Weile):
#   - von Hand: Actions → "Gym-App iOS (unsignierte IPA)" → "Run workflow"
#     Ergebnis: Artefakt am Lauf (30 Tage), Download erfordert GitHub-Anmeldung.
#   - bei Tags der Form gym-app-v1.2.3: zusätzlich wird ein Release mit der .ipa angelegt
#     (Download ohne Anmeldung, auch direkt auf dem iPhone möglich).
on:
  workflow_dispatch:
    inputs:
      live_activity:
        description: 'Live-Aktivität (Widget-Erweiterung) einbauen – experimentell'
        type: boolean
        default: false
  push:
    tags:
      - 'gym-app-v*'

permissions:
  contents: write # Release bei Tags
  actions: write # danach die Web-Veröffentlichung anstoßen (Archiv der Versionen)

concurrency:
  group: gym-app-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: IPA bauen
    # macOS 26 (Apple Silicon) bringt Xcode 26 mit – Capacitor 8 verlangt mindestens Xcode 26.0.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            gym-app/webapp/package-lock.json
            gym-app/ipa-app/package-lock.json

      - name: Xcode 26 auswählen
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi -e beta -e release_candidate -e _rc | sort -V | tail -1 || true)"
          if [ -z "$XCODE" ]; then
            echo "Kein Xcode 26 auf diesem Runner gefunden. Vorhanden:"; ls -d /Applications/Xcode*; exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Web-App – Abhängigkeiten installieren
        working-directory: gym-app/webapp
        run: npm ci

      - name: Web-App – Tests
        working-directory: gym-app/webapp
        run: npm test

      - name: Web-App – Build
        working-directory: gym-app/webapp
        run: npm run build

      - name: iOS-Hülle – Abhängigkeiten installieren
        working-directory: gym-app/ipa-app
        run: npm ci

      - name: iOS-Projekt erzeugen (Capacitor) und anpassen
        working-directory: gym-app/ipa-app
        env:
          LIVE_ACTIVITY: ${{ inputs.live_activity == true && '1' || '0' }}
        run: bash scripts/ios-prepare.sh

      - name: Version festlegen
        id: ver
        working-directory: gym-app/webapp
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAGVER="${GITHUB_REF_NAME#gym-app-v}"
          # Nur echte Versionsnummern (1, 1.2, 1.2.3) aus dem Tag übernehmen, sonst gilt package.json.
          if [[ "${GITHUB_REF_NAME}" == gym-app-v* && "$TAGVER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then VERSION="$TAGVER"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, Build ${GITHUB_RUN_NUMBER}"

      - name: Archivieren (ohne Signierung)
        working-directory: gym-app/ipa-app
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Eisenzeit.xcarchive \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | tail -n 60

      - name: IPA packen
        working-directory: gym-app/ipa-app
        run: |
          APP="$(find build/Eisenzeit.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$APP" ] || { echo "Keine .app im Archiv gefunden"; exit 1; }
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          [ "$BID" = "de.eisenzeit.app" ] || { echo "Falsche Bundle-Kennung: $BID"; exit 1; }
          [ -f "$APP/public/index.html" ] || { echo "Web-Dateien fehlen in der App"; exit 1; }
          if [ "${{ inputs.live_activity == true && '1' || '0' }}" = "1" ]; then
            [ -d "$APP/PlugIns/EisenzeitWidget.appex" ] || { echo "Widget-Erweiterung fehlt in der App (PlugIns/EisenzeitWidget.appex)"; ls "$APP"; exit 1; }
          fi
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Eisenzeit.ipa Payload)
          ls -lh build/Eisenzeit.ipa
          unzip -l build/Eisenzeit.ipa | tail -n 3

      - name: IPA als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: eisenzeit-ios-ipa-${{ steps.ver.outputs.version }}-${{ github.run_number }}${{ inputs.live_activity == true && '-live-aktivitaet' || '' }}
          path: gym-app/ipa-app/build/Eisenzeit.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Release mit der IPA anlegen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/gym-app-v')
        working-directory: gym-app/ipa-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/Eisenzeit.ipa "build/Eisenzeit-${{ steps.ver.outputs.version }}.ipa"
          gh release create "$GITHUB_REF_NAME" "build/Eisenzeit-${{ steps.ver.outputs.version }}.ipa" \
            --title "Eisenzeit ${{ steps.ver.outputs.version }}" \
            --notes "Unsignierte .ipa zum Installieren mit AltStore oder Sideloadly. Anleitung: gym-app/ipa-app/INSTALLATION.md" \
            --verify-tag

      - name: Web-Archiv der Versionen aktualisieren (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/gym-app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gym-app-webapp.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Build-Protokoll bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: gym-app/ipa-app/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
