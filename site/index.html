<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Apps</title>
    <style>
      :root {
        --bg: #000;
        --card: #1c1c1e;
        --text: #fff;
        --muted: rgba(235, 235, 245, 0.6);
        --accent: #ff9f0a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f2f2f7;
          --card: #fff;
          --text: #000;
          --muted: rgba(60, 60, 67, 0.74);
          --accent: #c93400;
        }
      }
      body {
        margin: 0;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        font: 17px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 34px;
        margin: 8px 0 20px;
      }
      a.card {
        display: block;
        padding: 16px;
        border-radius: 14px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a.card strong {
        display: block;
        font-size: 20px;
        color: var(--accent);
      }
      a.card span {
        color: var(--muted);
        font-size: 15px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps</h1>
      <a class="card" href="gym-app/">
        <strong>Eisenzeit</strong>
        <span>Trainings-App für dein Studio – Pläne, Training, Fortschritt. Läuft im Browser und lässt sich auf dem iPhone zum Home-Bildschirm hinzufügen.</span>
      </a>
      <p>Die Anleitung zum Installieren steht im Repository unter <em>gym-app/webapp/INSTALLATION.md</em>.</p>
    </main>
  </body>
</html>
