# Flimmerfrei – XcodeGen-Beschreibung (die .xcodeproj wird nicht eingecheckt, sondern mit `xcodegen generate` erzeugt)
name: Flimmerfrei

options:
  bundleIdPrefix: de.flimmerfrei
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  Flimmerfrei:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # Kern-Dateien als Bundle-Ressourcen. Bewusst NICHT optional: fehlen sie, soll der Bau scheitern.
      - path: ../core/dist/flimmerfrei.inject.js
        buildPhase: resources
      - path: ../core/rules/content-blocker.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Flimmerfrei
        PRODUCT_BUNDLE_IDENTIFIER: de.flimmerfrei.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Der Bau auf dem Runner läuft ohne Signierung (Kommandozeile setzt CODE_SIGNING_ALLOWED=NO usw.)
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

schemes:
  Flimmerfrei:
    build:
      targets:
        Flimmerfrei: all
    run:
      config: Debug
    archive:
      config: Release
